<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Starthrower</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="lib/aframe.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a-scene background="color: #0b1030" renderer="colorManagement: true"
           space-sky ambient-director target-manager projectile-pool calibration game-manager audio-director debug-panel>
    <a-entity id="rig" position="0 0 0" rail-mover>
      <a-entity id="head" camera position="0 1.6 0"></a-entity>
      <a-entity id="handL" hand-tracking-controls="hand: left" hand-thrower="hand: left"></a-entity>
      <a-entity id="handR" hand-tracking-controls="hand: right" hand-thrower="hand: right"></a-entity>
      <a-entity id="hud" hud position="0 1.1 -1.6"></a-entity>
    </a-entity>

    <a-entity id="guardian" guardian></a-entity>

    <a-entity id="core" hit-target="type: core; radius: 0.6" core-flash
              geometry="primitive: sphere; radius: 0.5"
              material="shader: flat; color: #ffc857"
              position="0 1.6 -6"></a-entity>
  </a-scene>
</body>
</html>
